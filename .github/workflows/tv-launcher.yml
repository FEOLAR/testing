name: WhiteHole TV launcher

on:
  push:
    branches:
      - claude/whitehole-tv-launcher
      - claude/tv-builtin-vpn
    paths:
      - "tv-launcher/**"
      - ".github/workflows/tv-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-launcher-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ветка встроенного VPN публикуется в отдельный тестовый релиз и не трогает tv-launcher-latest
      RELEASE_TAG: ${{ github.ref_name == 'claude/tv-builtin-vpn' && 'tv-launcher-vpn-test' || 'tv-launcher-latest' }}
      APK_BASE: ${{ github.ref_name == 'claude/tv-builtin-vpn' && 'whitehole-tv-vpn' || 'whitehole-tv' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch VPN core (libv2ray.aar) and geo files
        working-directory: tv-launcher
        run: bash vpn/fetch-deps.sh

      - name: Unit tests + release APKs
        working-directory: tv-launcher
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: tv-launcher
        run: |
          if [ -f build.log ]; then
            grep -nE "^e: |error:|ERROR|What went wrong|FAILURE|FAILED|Could not|not found|Unresolved|expected:|> " build.log | head -n 80 > errors.txt || true
            [ -s errors.txt ] || tail -n 60 build.log > errors.txt
            msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
          fi
          for f in app/build/test-results/testReleaseUnitTest/*.xml; do
            [ -f "$f" ] && grep -l "<failure" "$f" && grep -A5 "<failure" "$f" | head -n 30 || true
          done

      - name: Prepare APKs
        run: |
          out=tv-launcher/app/build/outputs/apk/release
          ls -la "$out"
          cp "$out/app-universal-release.apk" "${APK_BASE}.apk"
          cp "$out/app-arm64-v8a-release.apk" "${APK_BASE}-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk" "${APK_BASE}-armeabi-v7a.apk"
          {
            echo "### APK"
            for f in ${APK_BASE}*.apk; do echo "- \`$f\`: $(( $(stat -c %s "$f") / 1024 / 1024 )) МБ ($(stat -c %s "$f") байт)"; done
          } | tee -a "$GITHUB_STEP_SUMMARY" > sizes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASE }}
          path: ${{ env.APK_BASE }}*.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$RELEASE_TAG" = "tv-launcher-vpn-test" ]; then
            TITLE="WhiteHole TV — тест встроенного VPN"
            NOTES="Тестовая сборка лаунчера со встроенным VPN (ядро Xray). Ветка ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA}, сборка №${GITHUB_RUN_NUMBER}. Ставить ${APK_BASE}.apk (универсальный) или вариант под процессор ТВ."
            PRE="--prerelease"
          else
            TITLE="WhiteHole TV — последняя сборка"
            NOTES="Последняя сборка лаунчера WhiteHole для Android TV. Коммит: ${GITHUB_SHA}. Сборка №${GITHUB_RUN_NUMBER}."
            PRE=""
          fi
          NOTES="${NOTES}

          $(cat sizes.md)"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "${GITHUB_SHA}" --title "$TITLE" --notes "$NOTES" $PRE
          else
            gh release edit "$RELEASE_TAG" --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" ${APK_BASE}*.apk --clobber
