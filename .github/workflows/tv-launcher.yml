name: WhiteHole TV launcher

on:
  push:
    branches:
      - claude/whitehole-tv-launcher
    paths:
      - "tv-launcher/**"
      - ".github/workflows/tv-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-launcher
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        working-directory: tv-launcher
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: tv-launcher
        run: |
          if [ -f build.log ]; then
            grep -nE "^e: |error:|ERROR|What went wrong|FAILURE|Could not|not found|Unresolved|> " build.log | head -n 60 > errors.txt || true
            [ -s errors.txt ] || tail -n 60 build.log > errors.txt
            msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
          fi

      - name: Prepare APK
        run: cp tv-launcher/app/build/outputs/apk/release/app-release.apk whitehole-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: whitehole-tv
          path: whitehole-tv.apk

      - name: Publish to GitHub Release (tv-launcher-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Последняя сборка лаунчера WhiteHole для Android TV. Коммит: ${GITHUB_SHA}. Сборка №${GITHUB_RUN_NUMBER}."
          if ! gh release view tv-launcher-latest >/dev/null 2>&1; then
            gh release create tv-launcher-latest --target "${GITHUB_SHA}" --title "WhiteHole TV — последняя сборка" --notes "${NOTES}"
          else
            gh release edit tv-launcher-latest --notes "${NOTES}"
          fi
          gh release upload tv-launcher-latest whitehole-tv.apk --clobber
