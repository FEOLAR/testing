name: WhiteHole Setup (Windows)

on:
  push:
    branches:
      - claude/whitehole-setup-win
    paths:
      - "tv-setup/**"
      - ".github/workflows/tv-setup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-setup
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: tv-setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Unit tests
        run: |
          python -m pytest -q -p no:cacheprovider tests *>&1 | Tee-Object -FilePath ci-pytest.log
          if ($LASTEXITCODE -ne 0) { throw "pytest failed" }

      - name: Verify catalog.json (official direct links exist)
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python tools/verify_catalog.py catalog.json *>&1 | Tee-Object -FilePath ci-catalog.log
          if ($LASTEXITCODE -ne 0) { throw "catalog verification failed" }

      - name: Download Android platform-tools (adb)
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath pt -Force
          Get-ChildItem pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll
          & pt/platform-tools/adb.exe version

      - name: Build WhiteHoleSetup.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name WhiteHoleSetup `
            --icon assets/icon.ico `
            --add-binary "pt/platform-tools/adb.exe;adb" `
            --add-binary "pt/platform-tools/AdbWinApi.dll;adb" `
            --add-binary "pt/platform-tools/AdbWinUsbApi.dll;adb" `
            --add-data "assets/icon.ico;assets" `
            --add-data "assets/logo.png;assets" `
            --add-data "catalog.json;." `
            --collect-data customtkinter `
            --hidden-import psutil `
            main.py *>&1 | Tee-Object -FilePath ci-build.log
          if ($LASTEXITCODE -ne 0) { throw "pyinstaller failed" }
          Get-Item dist/WhiteHoleSetup.exe | Format-List Name, Length

      - name: Self-test of the built exe (bundled adb works)
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath dist/WhiteHoleSetup.exe -ArgumentList @("--selftest", $out) -Wait -PassThru
          if (Test-Path $out) { Get-Content $out | Tee-Object -FilePath ci-selftest.log } else { "no selftest output" | Tee-Object -FilePath ci-selftest.log }
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          for f in ci-pytest.log ci-catalog.log ci-build.log ci-selftest.log; do
            [ -f "$f" ] || continue
            body=$(grep -nE "Error|error|FAILED|failed|Traceback|assert|RESULT|adb:" "$f" | head -n 50)
            [ -n "$body" ] || body=$(tail -n 50 "$f")
            msg=$(printf '%s\n' "$body" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${f}::${msg}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: WhiteHoleSetup
          path: tv-setup/dist/WhiteHoleSetup.exe

      - name: Move tag tv-setup-latest to this commit
        shell: bash
        working-directory: .
        run: |
          git tag -f tv-setup-latest "${GITHUB_SHA}"
          git push -f origin refs/tags/tv-setup-latest

      - name: Publish to GitHub Release (tv-setup-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-setup-latest
          target_commitish: ${{ github.sha }}
          name: "WhiteHole Setup — последняя сборка"
          body: |
            Программа для Windows: ставит лаунчер WhiteHole и Happ на Android TV в пару кликов.
            Скачайте **WhiteHoleSetup.exe** ниже и запустите. Windows может предупредить
            «Система Windows защитила ваш компьютер» — нажмите «Подробнее» → «Выполнить в любом случае».

            Коммит: ${{ github.sha }}, сборка №${{ github.run_number }}.
          files: |
            tv-setup/dist/WhiteHoleSetup.exe
            tv-setup/catalog.json
          make_latest: false
          overwrite_files: true
