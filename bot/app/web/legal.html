<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>$title — $brand</title>
<meta name="description" content="$title сервиса $brand.">
<style>

:root{--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.28);--text:#f4f6fb;--muted:#9097a8;--ok:#34d399}
*{box-sizing:border-box}
html{background:#000}
body{margin:0;color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}
.space{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.7),transparent 60%),
  radial-gradient(1px 1px at 28% 62%,rgba(255,255,255,.45),transparent 60%),
  radial-gradient(1.5px 1.5px at 44% 8%,rgba(255,255,255,.6),transparent 60%),
  radial-gradient(1px 1px at 8% 84%,rgba(255,255,255,.4),transparent 60%),
  radial-gradient(1px 1px at 63% 33%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(1200px 500px at -10% 30%,rgba(120,140,190,.10),transparent 60%),#000}
.space:after{content:"";position:absolute;width:165vmax;height:165vmax;border-radius:50%;left:max(72%,calc(100% - 140px));top:-30vmax;
  background:radial-gradient(circle at 18% 45%,#2a2f3a 0%,#14171e 28%,#08090d 55%,#030304 75%);
  box-shadow:-1px 0 1px rgba(255,255,255,.75),-4px 0 14px rgba(220,230,255,.45),-24px 0 70px rgba(170,190,240,.22),inset 30px 0 60px rgba(200,215,255,.10)}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:600}
.top .logo{width:120px;height:58px;background:url(logo.webp) left center/contain no-repeat}
h1{font-size:26px;font-weight:800;margin:0 4px 4px;letter-spacing:-.2px}
.date{color:var(--muted);font-size:13.5px;margin:0 4px 16px}
.doc{padding:20px 18px;background:rgba(8,9,13,.92)}
@media (max-width:700px){.space:after{display:none}}
.doc h2{font-size:17px;font-weight:800;margin:22px 0 8px}
.doc h2:first-child{margin-top:0}
.doc p{margin:0 0 10px;color:#d7dce6}
.doc p.lead{color:#cdd2dd;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:6px}
.doc p.final{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.doc ul{margin:0 0 10px;padding-left:22px;color:#d7dce6}
.doc li{margin:4px 0}
.doc a{color:#fff;text-underline-offset:3px}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:24px}
.foot a{color:var(--muted);margin:0 6px}
@media print{.space,.top{display:none}body,html{background:#fff;color:#000}.card{border:0;background:none;box-shadow:none}.doc p,.doc ul{color:#000}}
</style>
</head>
<body>
<div class="space"></div>
<div class="wrap">
  <div class="top"><a class="logo" href="info" aria-label="$brand"></a><a href="info">← О сервисе</a></div>
  <h1>$title</h1>
  <div class="date">Редакция от $date</div>
  <div class="card doc">
$body
  </div>
  <div class="foot"><a href="terms">Пользовательское соглашение</a> · <a href="privacy">Политика конфиденциальности</a><br>© $brand</div>
</div>
</body>
</html>
